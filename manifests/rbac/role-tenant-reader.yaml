apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dfd-logs-reader
  namespace: calunga-tenant
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["tekton.dev"]
  resources: ["pipelineruns", "taskruns"]
  verbs: ["get", "list", "watch"]
